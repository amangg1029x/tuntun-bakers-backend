name: PostgreSQL migration checks

on:
  pull_request:
  push:
    branches:
      - migration/postgresql-foundation

permissions:
  contents: write

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: migration/postgresql-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install
      - name: Commit reconciled lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Reconcile lockfile for PostgreSQL migration"
            git push origin HEAD:migration/postgresql-foundation
          fi
      - name: Check JavaScript syntax
        run: npm run check
